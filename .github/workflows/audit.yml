name: audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 跑一次上游巡检，有新正式版就开 issue
    - cron: "0 3 * * 1"

jobs:
  audit:
    name: 配置门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 读取锁定的 sing-box 版本
        id: ver
        run: |
          echo "version=$(cut -d' ' -f1 singbox_version.txt)" >> "$GITHUB_OUTPUT"

      - name: 安装对应版本的 sing-box
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz"
          echo "下载 $URL"
          curl -fsSL "$URL" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp
          install -m 755 "/tmp/sing-box-${V}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: 配置与仓库门禁（9 类配置风险 + 台账 / 决策 / 防泄漏 / 工具自检 / 模板文字 / 平台矩阵 / 模板覆盖 / 覆盖窗口）
        env:
          SINGBOX_BIN: /usr/local/bin/sing-box
        run: python tools/audit.py --run --run-seconds 20

      - name: 门禁负向回归（故意改坏 66 处，确认门禁真的会响）
        run: python tools/negtest.py
      - name: 改文件方式指纹（BOM / NUL / 行尾）
        run: |
          # L40 那条铁律原本写着「门禁：无」—— 于是成了全仓唯一没有机器兜底的规则，
          # 被连犯 5 次。验不了「有没有用 patch-text」（绕过是通用能力），
          # 但**绕过才会留下的产物指纹**能验，且是确定性的。
          python tools/check-edit-method.py

      - name: 文档规则重复检测（单一来源原则）
        run: |
          # 本仓反复出现「同一条规则被两处各自完整陈述」——
          # 模块 2 规则清单、三栏分类表、完整克隆流程，都曾一字不差各写一遍。
          # 危害不是啰嗦，而是改一处忘一处、两份开始打架、没人知道哪份对（L46 成因）。
          python tools/audit_rules_dupe.py

      - name: markdown 结构校验（围栏 / 标题层级 / 链接 / 锚点）
        run: |
          # 本仓没有 markdownlint 配置 → 用 tools/mdlint.py 兜底。
          # 只查**确定性**错误（围栏不配对、标题层级跳跃、相对链接/锚点失效），
          # 不做风格审查：把风格偏好做成 ERROR 会让流水线长期红着，
          # 而「红灯一直亮」的后果是人不再看它（这一条写进了 mdlint.py 的注释）。
          python tools/mdlint.py

      - name: 更新负向回归用例数的说明
        run: |
          # 步骤名里的「28 处」是历史遗留，实际用例数已增至 32 —— 以 negtest 自身输出为准。
          python tools/negtest.py | tail -n 3


      - name: 校验配置 JSON 可被内核解码（check）
        run: |
          for f in profiles/*/*.json; do
            echo "== $f"
            sing-box check -c "$f"
          done

      - name: 说明：为什么还要 --run
        run: |
          echo "sing-box check 只反序列化、不做初始化，所以下面这类错它一律 exit=0："
          echo "  · 空的 direct 出站（'detour to an empty direct outbound makes no sense'）"
          echo "  · 规则集 / DNS / 出站初始化期的引用与资源问题"
          echo "audit.py --run 会把 tun 入站临时替成 mixed 并真跑一次 run，抓启动期 FATAL。"
          echo
          echo "另外，audit.py 每次都会做八道与具体配置无关的自检："
          echo "  · 教训台账双向一致 —— lessons_missing_gate / gate_without_lesson / lesson_missing_gate_line"
          echo "  · 决策记录双向一致 —— decision_without_record / decision_references_unknown"
          echo "  · 防泄漏扫查（被跟踪文件 + commit message）—— sensitive_ip_in_repo"
          echo "  · 工具自检（tools/*.py 能否编译、关键工具不变量）—— tool_syntax_error / tool_selftest_failed"
          echo "  · 模板文字检查（_rules_of_thumb 有没有写过期的口径）—— template_thumb_stale"
          echo "  · DNS 层广告拦截（白名单配套 / 动作 / 顺序与 route 层各自校验）—— dns_ad_without_whitelist / dns_ad_target / dns_ad_order"
          echo "  · 平台差异矩阵对账（PLATFORM-MATRIX.md §4 ⟺ 三份 profile）—— matrix_platform_stale / profile_drift"
          echo "  · 模板覆盖对账（templates/groups.json ⟺ 三份 profile 的分流组与类型）—— template_profile_group_missing / template_profile_group_type / profile_group_not_in_template"
          echo "  · 散文旧组名扫查（全仓 .md/.json/.py 的组名引用位）—— doc_group_name_stale"
          echo
          echo "而 tools/negtest.py 反向验证这些门禁**真的会响**：故意改坏 28 处配置/文档/矩阵，"
          echo "每处必须报出对应的 code。一个门禁只有「干净时安静 + 破坏时会响」两件事同时"
          echo "成立才算数；不跑负向回归，改门禁就等于拆掉回归网（L34 就是这样埋出来的）。"

      - name: 人读版矩阵是否与 JSON 同步
        run: |
          python tools/gen-docs.py
          if ! git diff --quiet -- docs/VERSION-MATRIX.md; then
            echo "::error::docs/VERSION-MATRIX.md 与 docs/version-matrix.json 不同步，请本地运行 python tools/gen-docs.py 后提交"
            git --no-pager diff -- docs/VERSION-MATRIX.md
            exit 1
          fi

  upstream-drift:
    name: 上游巡检（是否有新正式版）
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 巡检
        id: check
        run: |
          set +e
          python tools/upgrade-check.py --report /tmp/report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 有新正式版就开 issue
        if: steps.check.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const title = `sing-box 上游巡检：需要处理的变更（${new Date().toISOString().slice(0,10)}）`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift'
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-drift']
              });
            }
